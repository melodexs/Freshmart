{# Small outline icons for the header. Inline SVG, so they take the text colour and look the same on every phone and computer (emoji do not).
   Use: {% from "partials/icons.html" import icon %} then {{ icon("cart") }} #}
{% macro icon(name) -%}
<svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "user" -%}
<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.6-3.7 3.7-6 7.5-6s6.9 2.3 7.5 6"/>
{%- elif name == "user-plus" -%}
<circle cx="10" cy="8" r="3.6"/><path d="M3 20c.6-3.7 3.4-6 7-6 1.6 0 3 .4 4.2 1.2"/><path d="M18 14v6M15 17h6"/>
{%- elif name == "box" -%}
<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>
{%- elif name == "search" -%}
<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>
{%- elif name == "cart" -%}
<path d="M3 4h2.2l2 11h10.5l2-8H6.1"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>
{%- elif name == "logout" -%}
<path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9"/><path d="M15 8l4 4-4 4M19 12H9"/>
{%- elif name == "heart" -%}
<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/>
{%- endif -%}
</svg>
{%- endmacro %}
