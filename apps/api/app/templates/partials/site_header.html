<header>
  <div class="topbar">
    <div class="logo" aria-label="Okwui&#39;s Grocery Store (OGS)"><span class="logo-full">Okwui&#39;s Grocery Store </span><span class="logo-abbr">OGS</span></div>
    <div class="topbar-spacer"></div>
    <div id="account-area" class="account-area">{% include "partials/account.html" %}</div>
    <button class="icon-btn" id="ordersBtn" type="button"
            hx-get="/ui/orders" hx-target="#ordersList" hx-swap="innerHTML"
            data-open-modal="ordersOverlay">📦 Orders</button>
    <button class="icon-btn" id="trackBtn" type="button"
            hx-get="/ui/track" hx-target="#trackBody" hx-swap="innerHTML"
            data-open-modal="trackOverlay">🔎 Track</button>
    <button class="icon-btn" id="cartBtn" type="button">🛒 Cart <span class="cart-count" id="cartCount">0</span></button>
  </div>
  <div class="search-row"><div class="wrap"><div class="search" id="filters">
    <input id="searchInput" name="q" placeholder="Search rice, noodles, drinks..." autocomplete="off"
           hx-get="/ui/products" hx-trigger="input changed delay:200ms, search"
           hx-target="#catalog" hx-include="#filters">
    <input type="hidden" id="activeCat" name="cat" value="All">
    <select id="sortSelect" name="sort" class="sort-select" aria-label="Sort products"
            hx-get="/ui/products" hx-trigger="change" hx-target="#catalog" hx-include="#filters">
      <option value="default">Sort: Featured</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="name">Name: A to Z</option>
    </select>
  </div></div></div>
  <nav class="cats"><div class="wrap" id="catNav">
    {% for c in categories|default([]) %}
    <button type="button" class="{{ 'active' if c == active }}" hx-get="/ui/products" hx-vals='{"cat": {{ c|tojson|forceescape }}}'
            hx-include="#filters" hx-target="#catalog">{{ c }}</button>
    {% endfor %}
  </div></nav>
</header>
