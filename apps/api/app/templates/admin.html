<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OGS Admin</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="brand"><span class="mark">OGS</span><span>Admin</span></div>
    <p class="muted">Enter the staff key to manage the store.</p>
    <label for="staffKey">Staff key</label>
    <input id="staffKey" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="loginMsg" class="msg" role="alert"></p>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside class="side" id="side">
    <div class="brand"><span class="mark">OGS</span><span>Admin</span></div>
    <nav id="nav">
      <button data-view="overview" class="on">Overview</button>
      <button data-view="orders">Orders</button>
      <button data-view="products">Products</button>
      <button data-view="stock">Stock history</button>
      <button data-view="discounts">Discount codes</button>
      <button data-view="customers">Customers</button>
      <button data-view="settings">Store settings</button>
    </nav>
    <div class="side-foot">
      <a href="/" target="_blank" rel="noopener">View store</a>
      <button id="logout" class="link">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button id="menuBtn" class="menu" aria-label="Menu">☰</button>
      <h1 id="title">Overview</h1>
    </header>
    <div id="toast" class="toast" role="status" hidden></div>
    <section id="view"></section>
  </main>
</div>
<script src="/static/admin/admin.js"></script>
</body>
</html>
